<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" font-family="'Segoe UI','Leelawadee UI',Tahoma,sans-serif">
  <defs>
    <linearGradient id="jsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff1f5"/>
      <stop offset="0.55" stop-color="#eaf7f3"/>
      <stop offset="1" stop-color="#f5fbf8"/>
    </linearGradient>
    <linearGradient id="jteal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1aa093"/>
      <stop offset="1" stop-color="#147d72"/>
    </linearGradient>
    <linearGradient id="jhead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7a838"/>
      <stop offset="1" stop-color="#ec7d1e"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="800" fill="url(#jsky)"/>
  <circle cx="1600" cy="150" r="90" fill="#ffe3a8" opacity="0.55"/>
  <circle cx="1600" cy="150" r="60" fill="#ffd27a" opacity="0.7"/>

  <!-- clouds / doodles -->
  <g fill="none" stroke="#b7d8dc" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M120 120 q30 -26 60 0 q30 -20 55 6"/>
    <path d="M300 210 q22 -18 44 0"/>
    <path d="M1720 300 q22 -18 44 0"/>
  </g>
  <path d="M250 90 C 480 40, 760 40, 900 96" fill="none" stroke="#f2962a" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round" opacity="0.7"/>

  <!-- ===== LEFT scenery: Fuji + pagoda + torii ===== -->
  <g>
    <!-- Mt Fuji -->
    <path d="M60 560 L 250 300 L 440 560 Z" fill="#8fc3d6"/>
    <path d="M200 372 L 250 300 L 300 372 q-25 20 -50 4 q-25 16 -50 -4 Z" fill="#ffffff"/>
    <!-- pagoda -->
    <g fill="#c0453a">
      <rect x="120" y="470" width="70" height="90" rx="3" fill="#e7ded0"/>
      <path d="M112 470 L198 470 L182 446 L128 446 Z"/>
      <path d="M120 446 L190 446 L176 424 L134 424 Z"/>
      <path d="M128 424 L182 424 L168 404 L142 404 Z"/>
      <rect x="150" y="404" width="10" height="-16" fill="#c0453a"/>
    </g>
    <!-- torii -->
    <g fill="#d24c3f">
      <rect x="300" y="452" width="14" height="112"/>
      <rect x="366" y="452" width="14" height="112"/>
      <rect x="286" y="450" width="108" height="14" rx="3"/>
      <rect x="294" y="474" width="92" height="10"/>
    </g>
  </g>

  <!-- ===== RIGHT scenery: sakura branch ===== -->
  <g>
    <path d="M1900 210 q-120 30 -190 120 q-50 64 -70 150" fill="none" stroke="#7b5544" stroke-width="12" stroke-linecap="round"/>
    <path d="M1740 300 q-60 6 -96 44 M1720 400 q-56 20 -78 66" fill="none" stroke="#7b5544" stroke-width="8" stroke-linecap="round"/>
    <g fill="#f7b8cf">
      <circle cx="1720" cy="300" r="26"/><circle cx="1650" cy="342" r="24"/>
      <circle cx="1660" cy="452" r="26"/><circle cx="1610" cy="470" r="20"/>
      <circle cx="1800" cy="250" r="24"/><circle cx="1852" cy="286" r="18"/>
      <circle cx="1620" cy="392" r="18"/>
    </g>
    <g fill="#fff2f6">
      <circle cx="1720" cy="300" r="10"/><circle cx="1650" cy="342" r="9"/>
      <circle cx="1660" cy="452" r="10"/><circle cx="1800" cy="250" r="9"/>
    </g>
  </g>

  <!-- top-left script -->
  <text x="70" y="80" font-size="34" fill="#1aa093" font-style="italic" font-weight="700">Wecraft Travel</text>
  <text x="120" y="118" font-size="26" fill="#1aa093" font-style="italic">Let's Go!</text>

  <!-- ===== Brand ribbon ===== -->
  <g transform="translate(660,120)">
    <rect x="0" y="0" width="380" height="66" rx="33" fill="url(#jteal)"/>
    <path d="M-16 33 L4 18 L4 48 Z" fill="#0f6a60"/>
    <path d="M596 33 L576 18 L576 48 Z" transform="translate(-380,0)" fill="#0f6a60"/>
    <circle cx="52" cy="33" r="19" fill="#fff"/>
    <circle cx="46" cy="30" r="2.6" fill="#1aa093"/><circle cx="58" cy="30" r="2.6" fill="#1aa093"/>
    <path d="M45 37 q7 8 14 0" fill="none" stroke="#1aa093" stroke-width="2.6" stroke-linecap="round"/>
    <text x="205" y="44" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">ดีไซน์ความสุข</text>
  </g>

  <!-- ===== Headline ===== -->
  <text x="960" y="360" font-size="120" font-weight="900" fill="url(#jhead)" text-anchor="middle" stroke="#fff" stroke-width="8" paint-order="stroke">เที่ยวญี่ปุ่น</text>
  <text x="960" y="470" font-size="70" font-weight="900" fill="#1aa093" text-anchor="middle" stroke="#fff" stroke-width="6" paint-order="stroke">ซากุระบาน · ครบทุกซีซั่น</text>
  <text x="960" y="536" font-size="40" font-weight="700" fill="#2b6b64" text-anchor="middle">ไปกับ วีคราฟท์ ทราเวล</text>

  <!-- ===== Bottom teal band + contact ===== -->
  <path d="M0 648 Q960 606 1920 648 L1920 800 L0 800 Z" fill="url(#jteal)"/>

  <!-- feature icons row -->
  <g transform="translate(360,690)" fill="#fff" font-size="26" font-weight="700">
    <text x="0" y="8">✈ ทัวร์ต่างประเทศ</text>
    <text x="300" y="8">🎫 ตั๋วเครื่องบิน</text>
    <text x="540" y="8">🏨 โรงแรม</text>
    <text x="720" y="8">🧳 แพ็กเกจทัวร์</text>
    <text x="960" y="8">📘 วีซ่า</text>
  </g>

  <!-- contact pill -->
  <g transform="translate(360,730)">
    <rect x="0" y="0" width="1270" height="52" rx="26" fill="#ffffff" opacity="0.96"/>
    <g transform="translate(24,10)">
      <rect x="0" y="0" width="32" height="32" rx="8" fill="#06c755"/>
      <text x="16" y="22" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">L</text>
      <text x="44" y="23" font-size="24" font-weight="800" fill="#123">@wecrafttravel</text>
    </g>
    <text x="470" y="33" font-size="24" font-weight="800" fill="#d24c3f">📞 061-868-6889 · 065-239-8915</text>
    <text x="960" y="33" font-size="22" font-weight="700" fill="#1aa093">🌐 www.wecraft-travel.com</text>
  </g>
</svg>
