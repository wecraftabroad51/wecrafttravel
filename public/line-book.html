<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>จองทัวร์ · WeCraft Travel</title>
<style>
  :root { --teal:#0f9d8f; --teal-d:#0b7d72; --red:#e2231a; --ink:#1a2b3c; --muted:#8a94a0; --line:#e6e9ee; --bg:#f4f6f8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans Thai",Tahoma,sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:0 0 40px; }
  .hero { position:relative; }
  .hero img { width:100%; height:180px; object-fit:cover; display:block; background:#dfe4ea; }
  .hero .badge { position:absolute; left:12px; bottom:12px; background:rgba(15,157,143,.95);
    color:#fff; font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px; }
  .card { background:#fff; margin:12px; border-radius:16px; padding:16px 16px 18px;
    box-shadow:0 2px 14px rgba(20,40,60,.06); }
  h1 { font-size:17px; line-height:1.35; margin:0 0 6px; }
  .price { color:var(--red); font-weight:800; font-size:20px; }
  .price small { color:var(--muted); font-weight:500; font-size:12px; }
  label { display:block; font-size:13px; font-weight:700; margin:14px 0 6px; color:#33424f; }
  label .req { color:var(--red); }
  input,select,textarea { width:100%; font-size:16px; padding:12px 12px; border:1.5px solid var(--line);
    border-radius:11px; background:#fbfcfd; color:var(--ink); font-family:inherit; outline:none; }
  input:focus,select:focus,textarea:focus { border-color:var(--teal); background:#fff; }
  textarea { resize:vertical; min-height:60px; }
  .hint { font-size:11.5px; color:var(--muted); margin-top:5px; }
  .stepper { display:flex; align-items:center; gap:0; border:1.5px solid var(--line); border-radius:11px; overflow:hidden; background:#fbfcfd; }
  .stepper button { width:48px; height:48px; border:0; background:#f0f3f5; color:var(--teal-d);
    font-size:22px; font-weight:700; line-height:1; }
  .stepper button:active { background:#e2e8ec; }
  .stepper input { border:0; text-align:center; background:transparent; font-weight:700; }
  .paxrow { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .paxrow .full { grid-column:1 / -1; }
  .submit { width:calc(100% - 24px); margin:18px 12px 0; padding:16px; background:var(--red); color:#fff;
    border:0; border-radius:14px; font-size:17px; font-weight:800; box-shadow:0 6px 16px rgba(226,35,26,.28); }
  .submit:disabled { background:#c9ced4; box-shadow:none; }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin:16px 12px 0; line-height:1.6; }
  .center { text-align:center; }
  .spin { width:34px;height:34px;border:3px solid #dfe4ea;border-top-color:var(--teal);border-radius:50%;
    animation:sp .8s linear infinite; margin:60px auto; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .ok { text-align:center; padding:40px 22px; }
  .ok .tick { width:76px;height:76px;border-radius:50%;background:var(--teal);color:#fff;font-size:42px;
    line-height:76px; margin:0 auto 16px; }
  .ok h2 { margin:0 0 6px; font-size:20px; }
  .ok .ref { display:inline-block; background:#eaf7f5; color:var(--teal-d); font-weight:800;
    padding:6px 14px; border-radius:20px; margin:10px 0; font-size:15px; }
  .err { background:#fdeaea; color:#b3261e; border-radius:11px; padding:12px; font-size:13px; margin:12px 12px 0; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="spin"></div>
</div>

<script>
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function parseDate(s){
  if(!s) return null;
  s = String(s).trim();
  let y,m,d;
  let mt = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(mt){ y=+mt[1]; m=+mt[2]; d=+mt[3]; }
  else { mt = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if(mt){ d=+mt[1]; m=+mt[2]; y=+mt[3]; } }
  if(!y) return null;
  return { y, m, d };
}
function fmtDate(s){
  const o = parseDate(s); if(!o) return s||'';
  const yy = String((o.y + 543) % 100).padStart(2,'0');
  return `${o.d} ${TH_MON[o.m-1]||''} ${yy}`;
}
function baht(n){ n = Number(n)||0; return '฿' + n.toLocaleString('en-US'); }
function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
const qs = new URLSearchParams(location.search);
const P = { id: qs.get('id')||'', iso: qs.get('iso')||'', uid: qs.get('uid')||'' };
const app = document.getElementById('app');
let TOUR = null, DEPS = [];

(async function init(){
  try{
    const url = '/api/tour-feed' + (P.iso ? ('?c=' + encodeURIComponent(P.iso)) : '');
    const list = await fetch(url).then(r=>r.json()).catch(()=>[]);
    TOUR = (Array.isArray(list) ? list : []).find(t => t.id === P.id) || null;
    if(!TOUR && P.iso){ const all = await fetch('/api/tour-feed').then(r=>r.json()).catch(()=>[]); TOUR = (all||[]).find(t=>t.id===P.id)||null; }
    DEPS = (TOUR && TOUR.deps) ? TOUR.deps : [];
    renderForm();
  }catch(e){ app.innerHTML = '<div class="err">โหลดข้อมูลทัวร์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง</div>'; }
})();

function renderForm(){
  const img = TOUR && TOUR.image ? TOUR.image : '';
  const name = TOUR ? TOUR.name : 'จองทัวร์';
  const code = TOUR ? (TOUR.code||'') : '';
  const price = TOUR ? TOUR.price : 0;
  const roundOpts = DEPS.map((d,i)=>{
    const label = fmtDate(d.date) + (d.ret ? ' - ' + fmtDate(d.ret) : '') + ' · ' + baht(d.adult)
      + (d.seat!=null ? ` (ว่าง ${d.seat})` : '');
    return `<option value="${i}">${esc(label)}</option>`;
  }).join('');

  app.innerHTML = `
    <div class="hero">
      ${img ? `<img src="${esc(img)}" alt="">` : ''}
      ${code ? `<span class="badge">${esc(code)}</span>` : ''}
    </div>
    <div class="card">
      <h1>${esc(name)}</h1>
      ${price ? `<div class="price">${baht(price)} <small>/ ท่าน (เริ่มต้น)</small></div>` : ''}
    </div>
    <form id="f" class="card" novalidate>
      <label>ชื่อ-นามสกุล ผู้จอง <span class="req">*</span></label>
      <input name="fullName" autocomplete="name" placeholder="เช่น สมชาย ใจดี" required>

      <label>เบอร์โทรติดต่อ <span class="req">*</span></label>
      <input name="phone" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxx" required>

      ${DEPS.length ? `
      <label>รอบเดินทาง (วันไป - วันกลับ) <span class="req">*</span></label>
      <select name="roundIdx" required>
        <option value="" disabled selected>— เลือกรอบเดินทาง —</option>
        ${roundOpts}
      </select>` : `
      <label>รอบ / เดือนที่สนใจ</label>
      <input name="roundText" placeholder="เช่น ธันวาคม 2568">`}

      <label>จำนวนผู้เดินทาง <span class="req">*</span></label>
      <div class="paxrow">
        ${stepper('adults','ผู้ใหญ่',1)}
        ${stepper('children','เด็ก',0)}
        ${stepper('infants','ทารก (อายุ < 2 ปี)',0,'full')}
      </div>

      <label>อีเมล (ถ้ามี — สำหรับส่งใบยืนยัน)</label>
      <input name="email" inputmode="email" autocomplete="email" placeholder="you@email.com">

      <label>เลขพาสปอร์ต (ถ้ามี)</label>
      <input name="passportNo" placeholder="กรอกภายหลังได้">

      <label>หมายเหตุเพิ่มเติม</label>
      <textarea name="note" placeholder="เช่น ขอที่นั่งติดกัน, แพ้อาหาร ฯลฯ"></textarea>

      <button type="submit" class="submit" id="btn">ยืนยันการจอง</button>
      <div id="ferr"></div>
      <div class="foot">ทีมงาน WeCraft Travel จะติดต่อกลับเพื่อยืนยันรายละเอียด<br>และการชำระเงินโดยเร็วที่สุด 🙏</div>
    </form>
  `;
  wireSteppers();
  document.getElementById('f').addEventListener('submit', submit);
}

function stepper(nm, label, def, cls){
  return `<div class="${cls||''}">
    <label style="margin-top:0">${label}</label>
    <div class="stepper">
      <button type="button" data-step="${nm}" data-dir="-1">−</button>
      <input name="${nm}" type="number" inputmode="numeric" value="${def}" min="0" readonly>
      <button type="button" data-step="${nm}" data-dir="1">+</button>
    </div>
  </div>`;
}
function wireSteppers(){
  document.querySelectorAll('[data-step]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const inp = document.querySelector(`input[name="${b.dataset.step}"]`);
      let v = (parseInt(inp.value,10)||0) + (b.dataset.dir==='1'?1:-1);
      const min = b.dataset.step==='adults' ? 1 : 0;
      if(v < min) v = min; if(v > 99) v = 99;
      inp.value = v;
    });
  });
}

async function submit(e){
  e.preventDefault();
  const f = e.target, btn = document.getElementById('btn'), errBox = document.getElementById('ferr');
  errBox.innerHTML = '';
  const g = n => (f.elements[n] ? f.elements[n].value.trim() : '');
  const fullName = g('fullName'), phone = g('phone');
  if(!fullName){ return showErr('กรุณากรอกชื่อ-นามสกุล'); }
  if(phone.replace(/\D/g,'').length < 9){ return showErr('กรุณากรอกเบอร์โทรให้ถูกต้อง'); }
  const adults = +g('adults')||0, children = +g('children')||0, infants = +g('infants')||0;

  let depDate='', retDate='', roundLabel='';
  if(DEPS.length){
    const idx = g('roundIdx');
    if(idx===''){ return showErr('กรุณาเลือกรอบเดินทาง'); }
    const d = DEPS[+idx]; depDate = d.date||''; retDate = d.ret||'';
    roundLabel = fmtDate(depDate) + (retDate ? ' - ' + fmtDate(retDate) : '');
  } else {
    roundLabel = g('roundText');
  }

  const formData = {
    _type:'join-tour',
    fullName, phone, email: g('email'),
    tourCode: TOUR ? (TOUR.code||'') : '',
    tourName: TOUR ? (TOUR.name||'') : '',
    depDate, retDate,
    adults, children, infants,
    totalPax: adults + children + infants,
    passportNo: g('passportNo'),
    note: [g('note'), roundLabel && !DEPS.length ? `รอบที่สนใจ: ${roundLabel}` : '', 'ช่องทาง: จองผ่าน LINE']
            .filter(Boolean).join(' | '),
    lineUserId: P.uid || '',
  };
  const html = `<h3>🌏 จองจอยทัวร์ (ผ่านฟอร์ม LINE)</h3>
    <p><b>ทัวร์:</b> ${esc(formData.tourName)} (${esc(formData.tourCode)})<br>
    <b>ชื่อ:</b> ${esc(fullName)}<br><b>เบอร์:</b> ${esc(phone)}<br>
    <b>รอบ:</b> ${esc(roundLabel||'-')}<br>
    <b>จำนวน:</b> ผู้ใหญ่ ${adults} / เด็ก ${children} / ทารก ${infants}<br>
    <b>อีเมล:</b> ${esc(formData.email||'-')}<br><b>พาสปอร์ต:</b> ${esc(formData.passportNo||'-')}</p>`;

  btn.disabled = true; btn.textContent = 'กำลังส่ง...';
  try{
    const r = await fetch('/api/send-email', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ subject:`[LINE] จองจอยทัวร์ - ${formData.tourName}`, html, formData })
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||'ส่งไม่สำเร็จ');
    success(j.seqNo, formData, roundLabel);
  }catch(err){
    btn.disabled = false; btn.textContent = 'ยืนยันการจอง';
    showErr('ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่ หรือทักแชทหาทีมงานได้เลยครับ');
  }
  function showErr(m){ errBox.innerHTML = `<div class="err">${m}</div>`; errBox.scrollIntoView({behavior:'smooth',block:'center'}); }
}
function showErr(m){ const e=document.getElementById('ferr'); if(e) e.innerHTML = `<div class="err">${m}</div>`; }

function success(seq, fd, roundLabel){
  const pax = [fd.adults?`ผู้ใหญ่ ${fd.adults}`:'', fd.children?`เด็ก ${fd.children}`:'', fd.infants?`ทารก ${fd.infants}`:''].filter(Boolean).join(' · ');
  app.innerHTML = `
    <div class="card ok">
      <div class="tick">✓</div>
      <h2>จองสำเร็จแล้ว!</h2>
      ${seq ? `<div class="ref">เลขที่จอง: ${esc(seq)}</div>` : ''}
      <p style="color:#5b6572;font-size:14px;line-height:1.7;margin:6px 0 0">
        🎫 ${esc(fd.tourName)}<br>
        ${roundLabel?`📅 ${esc(roundLabel)}<br>`:''}
        ${pax?`👥 ${esc(pax)}`:''}
      </p>
      <p style="color:#8a94a0;font-size:13px;margin-top:18px;line-height:1.7">
        ทีมงานได้รับข้อมูลแล้ว และส่งข้อความยืนยันไปที่แชท LINE ของคุณด้วยครับ<br>
        กดปิด (✕) มุมขวาบน เพื่อกลับไปที่แชท
      </p>
    </div>`;
  try { if(window.liff && liff.isInClient && liff.isInClient()) setTimeout(()=>liff.closeWindow(), 2500); } catch(e){}
}
</script>
</body>
</html>
