<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" font-family="'Segoe UI','Leelawadee UI',Tahoma,sans-serif">
  <defs>
    <linearGradient id="esky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7ecf6"/>
      <stop offset="0.55" stop-color="#eaf3f4"/>
      <stop offset="1" stop-color="#f5faf6"/>
    </linearGradient>
    <linearGradient id="eteal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1aa093"/>
      <stop offset="1" stop-color="#147d72"/>
    </linearGradient>
    <linearGradient id="ehead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7a838"/>
      <stop offset="1" stop-color="#ec7d1e"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="800" fill="url(#esky)"/>
  <circle cx="1610" cy="150" r="88" fill="#ffe3a8" opacity="0.5"/>
  <circle cx="1610" cy="150" r="58" fill="#ffd27a" opacity="0.66"/>
  <g fill="none" stroke="#b7d8dc" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M120 120 q30 -26 60 0 q30 -20 55 6"/>
    <path d="M1720 300 q22 -18 44 0"/>
  </g>
  <path d="M250 90 C 480 40, 760 40, 900 96" fill="none" stroke="#f2962a" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round" opacity="0.7"/>

  <!-- ===== LEFT: Eiffel Tower + Big Ben ===== -->
  <g>
    <!-- Eiffel -->
    <g fill="#6f8f97">
      <path d="M250 560 L286 380 L314 380 L350 560 Z"/>
      <path d="M268 470 L332 470 L338 496 L262 496 Z"/>
      <rect x="292" y="300" width="16" height="82"/>
      <path d="M276 382 L324 382 L300 300 Z"/>
    </g>
    <line x1="300" y1="300" x2="300" y2="276" stroke="#6f8f97" stroke-width="5"/>
    <!-- Big Ben -->
    <g fill="#b98a52">
      <rect x="120" y="410" width="60" height="150"/>
      <path d="M116 410 L184 410 L150 366 Z"/>
      <circle cx="150" cy="440" r="15" fill="#f4ead2"/>
      <line x1="150" y1="440" x2="150" y2="430" stroke="#7a5a48" stroke-width="3"/>
      <line x1="150" y1="440" x2="158" y2="444" stroke="#7a5a48" stroke-width="3"/>
    </g>
  </g>

  <!-- ===== RIGHT: Colosseum + Ferris wheel ===== -->
  <g>
    <!-- Ferris wheel -->
    <g stroke="#5f8f86" stroke-width="4" fill="none">
      <circle cx="1560" cy="360" r="90"/>
      <circle cx="1560" cy="360" r="60"/>
      <path d="M1560 270 L1560 450 M1470 360 L1650 360 M1496 296 L1624 424 M1624 296 L1496 424"/>
    </g>
    <line x1="1560" y1="360" x2="1530" y2="560" stroke="#5f8f86" stroke-width="5"/>
    <line x1="1560" y1="360" x2="1590" y2="560" stroke="#5f8f86" stroke-width="5"/>
    <g fill="#e07b3a"><circle cx="1560" cy="270" r="9"/><circle cx="1650" cy="360" r="9"/><circle cx="1560" cy="450" r="9"/><circle cx="1470" cy="360" r="9"/></g>
    <!-- Colosseum -->
    <g fill="#c8a06a">
      <path d="M1700 560 L1700 470 Q1800 430 1900 470 L1900 560 Z"/>
      <g fill="#a9824f">
        <rect x="1716" y="486" width="14" height="30" rx="5"/><rect x="1746" y="480" width="14" height="34" rx="5"/>
        <rect x="1776" y="476" width="14" height="36" rx="5"/><rect x="1806" y="476" width="14" height="36" rx="5"/>
        <rect x="1836" y="480" width="14" height="34" rx="5"/><rect x="1866" y="486" width="14" height="30" rx="5"/>
      </g>
    </g>
  </g>

  <!-- gondola/canal hint bottom-left -->
  <path d="M60 600 q40 20 90 8" fill="none" stroke="#5f8f86" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- top-left script -->
  <text x="70" y="80" font-size="34" fill="#1aa093" font-style="italic" font-weight="700">Wecraft Travel</text>
  <text x="120" y="118" font-size="26" fill="#1aa093" font-style="italic">Let's Go!</text>

  <!-- Brand ribbon -->
  <g transform="translate(660,120)">
    <rect x="0" y="0" width="380" height="66" rx="33" fill="url(#eteal)"/>
    <path d="M-16 33 L4 18 L4 48 Z" fill="#0f6a60"/>
    <path d="M216 33 L196 18 L196 48 Z" fill="#0f6a60"/>
    <circle cx="52" cy="33" r="19" fill="#fff"/>
    <circle cx="46" cy="30" r="2.6" fill="#1aa093"/><circle cx="58" cy="30" r="2.6" fill="#1aa093"/>
    <path d="M45 37 q7 8 14 0" fill="none" stroke="#1aa093" stroke-width="2.6" stroke-linecap="round"/>
    <text x="205" y="44" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">ดีไซน์ความสุข</text>
  </g>

  <!-- Headline -->
  <text x="960" y="360" font-size="120" font-weight="900" fill="url(#ehead)" text-anchor="middle" stroke="#fff" stroke-width="8" paint-order="stroke">เที่ยวยุโรป</text>
  <text x="960" y="470" font-size="70" font-weight="900" fill="#1aa093" text-anchor="middle" stroke="#fff" stroke-width="6" paint-order="stroke">หลายประเทศ · ครบทุกเส้นทาง</text>
  <text x="960" y="536" font-size="40" font-weight="700" fill="#2b6b64" text-anchor="middle">ไปกับ วีคราฟท์ ทราเวล</text>

  <!-- Bottom band + contact -->
  <path d="M0 648 Q960 606 1920 648 L1920 800 L0 800 Z" fill="url(#eteal)"/>
  <g transform="translate(360,690)" fill="#fff" font-size="26" font-weight="700">
    <text x="0" y="8">✈ ทัวร์ต่างประเทศ</text>
    <text x="300" y="8">🎫 ตั๋วเครื่องบิน</text>
    <text x="540" y="8">🏨 โรงแรม</text>
    <text x="720" y="8">🧳 แพ็กเกจทัวร์</text>
    <text x="960" y="8">📘 วีซ่า</text>
  </g>
  <g transform="translate(360,730)">
    <rect x="0" y="0" width="1270" height="52" rx="26" fill="#ffffff" opacity="0.96"/>
    <g transform="translate(24,10)">
      <rect x="0" y="0" width="32" height="32" rx="8" fill="#06c755"/>
      <text x="16" y="22" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">L</text>
      <text x="44" y="23" font-size="24" font-weight="800" fill="#123">@wecrafttravel</text>
    </g>
    <text x="470" y="33" font-size="24" font-weight="800" fill="#d24c3f">📞 061-868-6889 · 065-239-8915</text>
    <text x="960" y="33" font-size="22" font-weight="700" fill="#1aa093">🌐 www.wecraft-travel.com</text>
  </g>
</svg>
