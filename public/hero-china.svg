<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" font-family="'Segoe UI','Leelawadee UI',Tahoma,sans-serif">
  <defs>
    <linearGradient id="csky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7d6"/>
      <stop offset="0.55" stop-color="#f5efe4"/>
      <stop offset="1" stop-color="#f6f7f0"/>
    </linearGradient>
    <linearGradient id="cteal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1aa093"/>
      <stop offset="1" stop-color="#147d72"/>
    </linearGradient>
    <linearGradient id="chead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7a838"/>
      <stop offset="1" stop-color="#e0561e"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="800" fill="url(#csky)"/>
  <circle cx="1610" cy="150" r="88" fill="#ffd9a1" opacity="0.55"/>
  <circle cx="1610" cy="150" r="58" fill="#ffc074" opacity="0.7"/>
  <path d="M250 90 C 480 40, 760 40, 900 96" fill="none" stroke="#e0561e" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round" opacity="0.7"/>

  <!-- ===== LEFT: Great Wall on hills ===== -->
  <g>
    <path d="M20 560 q120 -120 260 -70 q120 44 250 -20 L530 560 Z" fill="#9ec9be"/>
    <path d="M30 520 q120 -110 250 -66 q130 46 250 -18" fill="none" stroke="#7a5a48" stroke-width="16"/>
    <g fill="#8a6552">
      <rect x="60" y="470" width="26" height="40"/><rect x="150" y="440" width="26" height="44"/>
      <rect x="250" y="452" width="26" height="42"/><rect x="360" y="470" width="26" height="42"/>
      <rect x="470" y="486" width="26" height="40"/>
    </g>
  </g>

  <!-- ===== RIGHT: pagoda gate + lanterns ===== -->
  <g>
    <!-- gate -->
    <g fill="#c0392b">
      <rect x="1700" y="470" width="150" height="96" fill="#e7ded0"/>
      <rect x="1690" y="452" width="170" height="22" rx="4"/>
      <path d="M1676 452 L1874 452 L1846 418 L1704 418 Z"/>
      <path d="M1700 418 L1850 418 L1826 392 L1724 392 Z"/>
      <rect x="1766" y="392" width="18" height="-14" fill="#e0a53a"/>
    </g>
    <rect x="1748" y="500" width="54" height="66" rx="8" fill="#8a1f16"/>
    <!-- lanterns -->
    <g>
      <line x1="1540" y1="180" x2="1540" y2="230" stroke="#7a5a48" stroke-width="4"/>
      <ellipse cx="1540" cy="270" rx="40" ry="46" fill="#d6342a"/>
      <rect x="1522" y="222" width="36" height="10" rx="3" fill="#e0a53a"/>
      <rect x="1522" y="310" width="36" height="10" rx="3" fill="#e0a53a"/>
      <path d="M1540 320 l0 26" stroke="#e0a53a" stroke-width="4"/>
      <line x1="1640" y1="150" x2="1640" y2="200" stroke="#7a5a48" stroke-width="4"/>
      <ellipse cx="1640" cy="238" rx="32" ry="38" fill="#d6342a"/>
      <rect x="1626" y="196" width="28" height="8" rx="3" fill="#e0a53a"/>
      <rect x="1626" y="272" width="28" height="8" rx="3" fill="#e0a53a"/>
    </g>
  </g>

  <!-- top-left script -->
  <text x="70" y="80" font-size="34" fill="#1aa093" font-style="italic" font-weight="700">Wecraft Travel</text>
  <text x="120" y="118" font-size="26" fill="#1aa093" font-style="italic">Let's Go!</text>

  <!-- Brand ribbon -->
  <g transform="translate(660,120)">
    <rect x="0" y="0" width="380" height="66" rx="33" fill="url(#cteal)"/>
    <path d="M-16 33 L4 18 L4 48 Z" fill="#0f6a60"/>
    <path d="M216 33 L196 18 L196 48 Z" fill="#0f6a60"/>
    <circle cx="52" cy="33" r="19" fill="#fff"/>
    <circle cx="46" cy="30" r="2.6" fill="#1aa093"/><circle cx="58" cy="30" r="2.6" fill="#1aa093"/>
    <path d="M45 37 q7 8 14 0" fill="none" stroke="#1aa093" stroke-width="2.6" stroke-linecap="round"/>
    <text x="205" y="44" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">ดีไซน์ความสุข</text>
  </g>

  <!-- Headline -->
  <text x="960" y="360" font-size="120" font-weight="900" fill="url(#chead)" text-anchor="middle" stroke="#fff" stroke-width="8" paint-order="stroke">เที่ยวจีน</text>
  <text x="960" y="470" font-size="70" font-weight="900" fill="#1aa093" text-anchor="middle" stroke="#fff" stroke-width="6" paint-order="stroke">มหัศจรรย์ · สุดอลังการ</text>
  <text x="960" y="536" font-size="40" font-weight="700" fill="#2b6b64" text-anchor="middle">ไปกับ วีคราฟท์ ทราเวล</text>

  <!-- Bottom band + contact -->
  <path d="M0 648 Q960 606 1920 648 L1920 800 L0 800 Z" fill="url(#cteal)"/>
  <g transform="translate(360,690)" fill="#fff" font-size="26" font-weight="700">
    <text x="0" y="8">✈ ทัวร์ต่างประเทศ</text>
    <text x="300" y="8">🎫 ตั๋วเครื่องบิน</text>
    <text x="540" y="8">🏨 โรงแรม</text>
    <text x="720" y="8">🧳 แพ็กเกจทัวร์</text>
    <text x="960" y="8">📘 วีซ่า</text>
  </g>
  <g transform="translate(360,730)">
    <rect x="0" y="0" width="1270" height="52" rx="26" fill="#ffffff" opacity="0.96"/>
    <g transform="translate(24,10)">
      <rect x="0" y="0" width="32" height="32" rx="8" fill="#06c755"/>
      <text x="16" y="22" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">L</text>
      <text x="44" y="23" font-size="24" font-weight="800" fill="#123">@wecrafttravel</text>
    </g>
    <text x="470" y="33" font-size="24" font-weight="800" fill="#d24c3f">📞 061-868-6889 · 065-239-8915</text>
    <text x="960" y="33" font-size="22" font-weight="700" fill="#1aa093">🌐 www.wecraft-travel.com</text>
  </g>
</svg>
